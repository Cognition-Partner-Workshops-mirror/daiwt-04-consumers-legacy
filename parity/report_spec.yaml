      "source": "mssql",
      "sql": "SELECT 'Regional Sales' AS tile_name, CONVERT(nvarchar(100),[territory]) AS label, value FROM (SELECT [territory] AS [territory], SUM([sales]) AS value FROM (SELECT TOP (100) c.[Sales Territory] AS territory, DATEPART(year,s.[Invoice Date Key]) AS sales_year, ISNULL(SUM(s.[Total Excluding Tax]),0) AS sales FROM Fact.Sale s JOIN Dimension.City c ON s.[City Key]=c.[City Key] GROUP BY c.[Sales Territory], DATEPART(year,s.[Invoice Date Key]) ORDER BY sales DESC, territory, sales_year) report_rows GROUP BY [territory]) marks UNION ALL SELECT 'Leading Customers' AS tile_name, CONVERT(nvarchar(100),[customer]) AS label, value FROM (SELECT [customer] AS [customer], SUM([sales]) AS value FROM (SELECT TOP (20) c.[Customer Key] AS customer_key, c.[Customer] AS customer, ISNULL(SUM(s.[Total Excluding Tax]),0) AS sales FROM Fact.Sale s JOIN Dimension.Customer c ON s.[Customer Key]=c.[Customer Key] GROUP BY c.[Customer Key],c.[Customer] ORDER BY sales DESC, customer_key) report_rows GROUP BY [customer]) marks UNION ALL SELECT 'Regional Targets' AS tile_name, CONVERT(nvarchar(100),[territory]) AS label, value FROM (SELECT [territory] AS [territory], SUM([sales])/100000.0 AS value FROM (SELECT TOP (100) c.[Sales Territory] AS territory, DATEPART(year,s.[Invoice Date Key]) AS sales_year, ISNULL(SUM(s.[Total Excluding Tax]),0) AS sales FROM Fact.Sale s JOIN Dimension.City c ON s.[City Key]=c.[City Key] GROUP BY c.[Sales Territory], DATEPART(year,s.[Invoice Date Key]) ORDER BY sales DESC, territory, sales_year) report_rows GROUP BY [territory]) marks",
      "grain": "one row per dashboard worksheet mark",
      "keys": [
        "tile_name",
        "label"
      ],
      "numeric_tolerance": {
        "absolute": 0.01,
        "relative": 0.000001
      },
      "name": "Regional Sales Overview",
      "parameters": {
        "Target Value": 100000
      }
    },
