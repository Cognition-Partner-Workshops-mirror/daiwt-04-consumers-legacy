    {
      "id": "measure_sales_yoy",
      "consumer": "powerbi",
      "source_file": "consumers/powerbi/Sales Performance.SemanticModel/definition/tables/Sale.tmdl",
      "kind": "measure",
      "source": "mssql",
      "sql": "SELECT (SUM(s.[Total Excluding Tax])-p.sales)/NULLIF(p.sales,0) AS value FROM Fact.Sale s CROSS JOIN (SELECT SUM([Total Excluding Tax]) AS sales FROM Fact.Sale WHERE [Invoice Date Key] >= '20150101' AND [Invoice Date Key] < '20160101') p WHERE s.[Invoice Date Key] >= '20160101' AND s.[Invoice Date Key] < '20170101' GROUP BY p.sales",
      "grain": "one scalar; Date[Calendar Year]=2016, comparison year=2015",
      "keys": [],
      "numeric_tolerance": {
        "absolute": 0.01,
        "relative": 0.000001
      },
      "name": "Sales YoY %"
    },
